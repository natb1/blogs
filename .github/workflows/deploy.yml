# Build every site and deploy it to its own Cloudflare Pages project.
#
# A push to main deploys production. Any other branch or pull request deploys a
# preview at <branch>.<project>.pages.dev, with drafts included — that is what a
# preview is for. A new folder under sites/ is picked up without editing this
# file; its project is created on first deploy.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account › Cloudflare Pages ›
# Edit) and CLOUDFLARE_ACCOUNT_ID. Without them the sites are still built and
# checked, and the deploy steps are skipped — as they are for a fork's pull
# request, which is never handed secrets.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sites:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "names=$(ls sites | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.sites.outputs.names) }}
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 tools/check_tokens.py
      - name: Build
        run: python3 tools/build.py "${{ matrix.site }}" ${{ env.BRANCH != 'main' && '--drafts' || '' }}
      - name: Read the site's Pages project
        id: site
        run: |
          echo "project=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('sites/${{ matrix.site }}/site.yaml'))['pages_project'])")" >> "$GITHUB_OUTPUT"
      - name: Create the Pages project if it is new
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "${{ steps.site.outputs.project }}" \
            || npx --yes wrangler@4 pages project create "${{ steps.site.outputs.project }}" --production-branch main
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages deploy "dist/${{ matrix.site }}" \
            --project-name "${{ steps.site.outputs.project }}" --branch "$BRANCH" \
            --commit-hash "${{ github.sha }}" --commit-dirty=true | tee deploy.log
          echo "### ${{ matrix.site }} → $(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "### ${{ matrix.site }} built, not deployed — CLOUDFLARE_API_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"
